<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #FFF5E5; }
    a { color: #E85486; } a:hover { color: #c53f70; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FFF5E5; font-family: 'Nunito', system-ui, sans-serif; color: #3A2E4A; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 16px;">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 38px; height: 38px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(58,46,74,0.08);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2E4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 17px;">160 tình huống</div>
    </div>
    <div style="background: #FFE5F1; color: #E85486; font-weight: 800; font-size: 12px; padding: 6px 12px; border-radius: 999px;">8 chủ đề</div>
  </div>

  <div style="font-weight: 700; font-size: 13px; color: #8A7E96;">Chọn một chủ đề để tập nói cùng con mỗi ngày.</div>

  <!-- Category grid: 8 chủ đề × 20 câu = 160 -->
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #FFE5C2; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF9F45" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Buổi sáng thức dậy</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #DCF6F3; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4ECDC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 3v7a3 3 0 0 0 3 3v8M7 3v6M18 3c-1.5 0-3 2-3 5s1.5 4 3 4v6"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Giờ ăn</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #E5F4FF; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5AB2E8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12V6a3 3 0 0 1 6 0M4 12h16l-1 6a3 3 0 0 1-3 2H8a3 3 0 0 1-3-2z"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Tắm & vệ sinh</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #FFE0EC; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B9D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Vui chơi</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #E6F7E9; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6BCB77" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Ra ngoài</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #FFF3CC; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E6B325" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.5 5 5.5.8-4 3.9 1 5.5L12 16l-5 2.9 1-5.5-4-3.9 5.5-.8z"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Học & khen ngợi</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #FFE7DE; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF7A59" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Cảm xúc</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

    <div style="background: #ffffff; border-radius: 20px; padding: 14px; box-shadow: 0 3px 10px rgba(58,46,74,0.06); display: flex; flex-direction: column; gap: 8px;">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #E7E0F6; display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A06CD5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 3 2 4 2 7h8c0-3 2-4 2-7a6 6 0 0 0-6-6zM9 22h6"/></svg></div>
      <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 15px;">Giờ đi ngủ</div>
      <div style="font-size: 11px; color: #8A7E96; font-weight: 700;">20 câu</div>
    </div>

  </div>

  <!-- Total -->
  <div style="margin-top: 2px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #FF6B9D; color: #ffffff; border-radius: 16px; padding: 12px; font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M20 6L9 17l-5-5"/></svg>
    8 chủ đề × 20 câu = 160 tình huống
  </div>

</div>
</x-dc>
</body>
</html>
