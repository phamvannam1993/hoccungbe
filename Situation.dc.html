<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #FFF5E5; }
    a { color: #E85486; } a:hover { color: #c53f70; }
  </style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; background: #FFF5E5; font-family: 'Nunito', system-ui, sans-serif; color: #3A2E4A; padding: 16px 18px 24px; display: flex; flex-direction: column; gap: 16px;">

  <!-- Header -->
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <div style="width: 38px; height: 38px; border-radius: 12px; background: #ffffff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(58,46,74,0.08);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3A2E4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 16px;">Buổi sáng thức dậy</div>
    <div style="background: #FFE5C2; color: #E6913A; font-weight: 800; font-size: 12px; padding: 6px 11px; border-radius: 999px;">3 / 20</div>
  </div>

  <!-- Progress dots -->
  <div style="display: flex; gap: 5px;">
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #FF9F45;"></div>
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #FF9F45;"></div>
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #FF9F45;"></div>
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #F0E4CF;"></div>
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #F0E4CF;"></div>
    <div style="height: 7px; flex: 1; border-radius: 999px; background: #F0E4CF;"></div>
  </div>

  <!-- Scene -->
  <div style="background: #E5F4FF; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 14px;">
    <svg width="72" height="66" viewBox="0 0 72 66" fill="none">
      <circle cx="52" cy="20" r="13" fill="#FFD93D"/>
      <path d="M52 2v5M52 33v5M34 20h5M65 20h5M39 7l3 3M62 30l3 3M65 7l-3 3M42 30l-3 3" stroke="#FFB020" stroke-width="2.4" stroke-linecap="round"/>
      <ellipse cx="34" cy="60" rx="30" ry="4" fill="rgba(58,46,74,0.08)"/>
      <circle cx="22" cy="34" r="12" fill="#FFE0B8"/>
      <path d="M11 34a11 11 0 0 1 22 0c-3-3-7-4-11-3-4-1-8 0-11 3z" fill="#3A2E4A"/>
      <path d="M12 56c0-6 4-10 10-10s10 4 10 10v4H12z" fill="#4ECDC4"/>
    </svg>
    <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 16px; line-height: 1.3;">Khi con vừa<br>thức dậy</div>
  </div>

  <!-- English phrase card -->
  <div style="background: #ffffff; border-radius: 24px; padding: 20px 18px; box-shadow: 0 6px 18px rgba(58,46,74,0.08); text-align: center;">
    <div style="font-size: 11px; font-weight: 800; color: #FF6B9D; letter-spacing: 0.06em; margin-bottom: 10px;">BA MẸ NÓI VỚI CON</div>
    <div style="font-family: 'Baloo 2', system-ui; font-weight: 700; font-size: 24px; line-height: 1.25; text-wrap: balance;">Good morning!<br>Did you sleep well?</div>
    <div style="font-size: 13px; color: #8A7E96; margin-top: 8px;">/ɡʊd ˈmɔːrnɪŋ &nbsp;dɪd juː sliːp wel/</div>

    <!-- Audio buttons -->
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 16px;">
      <div style="width: 64px; height: 64px; border-radius: 20px; background: #4ECDC4; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 #37b3ab;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18.5 5.5a9 9 0 0 1 0 13" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      </div>
      <div style="width: 50px; height: 50px; border-radius: 16px; background: #DCF6F3; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#37b3ab" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13c0-2 2-3 5-3l3-3 4 2 4-1c1 2-1 4-3 4l1 4-4 1-3-2-4 3c-2 0-3-2-3-4z"/><path d="M6 13h.01"/></svg>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 6px; font-size: 11px; font-weight: 800; color: #8A7E96;">
      <span>Nghe</span><span>Chậm</span>
    </div>
  </div>

  <!-- Vietnamese -->
  <div style="background: #FFE5F1; border-radius: 18px; padding: 13px 16px;">
    <div style="font-size: 11px; font-weight: 800; color: #E85486; margin-bottom: 2px;">NGHĨA</div>
    <div style="font-weight: 800; font-size: 16px;">Chào buổi sáng! Con ngủ ngon không?</div>
  </div>

  <!-- Tip -->
  <div style="display: flex; gap: 10px; align-items: flex-start; background: #FFF3CC; border-radius: 16px; padding: 12px 14px;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E6B325" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 1px;"><path d="M9 18h6M10 22h4M12 2a6 6 0 0 0-4 10c1 1 1 2 1 3h6c0-1 0-2 1-3a6 6 0 0 0-4-10z"/></svg>
    <div style="font-size: 12.5px; font-weight: 700; color: #7A6A2E; line-height: 1.4;">Mẹo: nói câu này mỗi sáng để con quen dần — lặp lại là cách nhớ tốt nhất!</div>
  </div>

  <!-- Nav -->
  <div style="display: flex; gap: 10px; margin-top: 2px;">
    <div style="flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px; background: #ffffff; border: 2px solid #EDE3D2; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A7E96" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    </div>
    <div style="flex: 1; height: 52px; border-radius: 16px; background: #FF6B9D; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Baloo 2', system-ui; font-weight: 800; font-size: 16px; box-shadow: 0 5px 0 #E85486;">
      Tình huống tiếp theo
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
